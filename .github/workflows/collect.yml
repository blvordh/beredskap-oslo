name: Innsamler

# Henter alle kilder og publiserer data/ til grenen "data" som ett enkelt commit
# (force-push), slik at main holder seg liten. Agent-filene i agent/ på main
# kopieres med, så nettsiden kan lese alt fra én gren:
#   https://raw.githubusercontent.com/<eier>/<repo>/data/status.json
#   https://raw.githubusercontent.com/<eier>/<repo>/data/nyheter.json

on:
  schedule:
    - cron: "*/10 * * * *"      # GitHub kjører tidligst hvert 5. min, og kan forsinke.
                                # Fila er rørt 27.10.2026 for å få schedule registrert (docs/funn-2026-10-27-cron-ikke-kjort.md).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: innsamler
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hent forrige data (for stale-håndtering)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git --work-tree=data checkout FETCH_HEAD -- . && git reset -q
          else
            echo "ingen data-gren ennå"
          fi

      - name: Kjør innsamler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m collector --config config.yaml

      - name: Ta med agent-filer fra main
        run: |
          mkdir -p data
          cp -f agent/*.json data/ 2>/dev/null || true

      - name: Publiser til grenen data
        run: |
          set -e
          cd data
          git init -q
          git checkout -q -b data
          git config user.name "beredskap-innsamler"
          git config user.email "innsamler@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
