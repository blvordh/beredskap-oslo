# Konfigurasjon for innsamleren til beredskap.oslo.no
# Fyll inn kontakt før første kjøring: MET avviser kall uten identifiserende User-Agent.

contact: "bl@vordh.com"
user_agent: "beredskap-oslo-collector/0.1 (+https://beredskap.oslo.no; {contact})"
et_client_name: "spark-beredskap-oslo"    # Entur: <firma>-<app>, gir høyere kvote

http:
  timeout_seconds: 20
  retries: 2
  workers: 8                              # parallelle kilder

output_dir: data

# Geografi
oslo:
  kommunenummer: "0301"
  fylkesnummer: "03"
  # Oslo-regionen som bbox for Vegvesen WFS: lat_min, lon_min, lat_max, lon_max
  bbox: [59.75, 10.45, 60.05, 11.05]
  # Veier vi regner som utfartsveier (brukes til stengnings-signal)
  hovedveier: ["E6", "E18", "E16", "RV4", "RV150", "R4", "R150"]
  # Stedsnavn som gjør et nasjonalt varsel (Nødvarsel, politilogg) til et lokalt
  stedsnavn: ["Oslo", "Bærum", "Asker", "Lillestrøm", "Lørenskog", "Nittedal", "Nordre Follo", "Oppegård", "Ski", "Nesodden", "Gardermoen", "Akershus"]

# Terskler for trafikklys
thresholds:
  strom:
    elvia_yellow_customers: 500
    elvia_red_customers: 5000
  transport:
    # Ruter har 50–80 avvik en vanlig dag; vi teller bare «alvorlige» (innstilt, stengt,
    # stans, eller bane/trikk/båt). Første ekte kjøring 27.10 kl. 09:29: 66 avvik totalt.
    ruter_yellow_serious: 4
    ruter_red_serious: 10
    ruter_red_rail: 3                 # rødt når minst så mange bane/trikk/båt-linjer har alvorlig avvik
    # Reisetid fra Vegvesen: i morgenrushet har 5–8 strekninger over 50 % forsinkelse,
    # så gult krever mer enn vanlig rush.
    traveltime_yellow_delay_percent: 75
    traveltime_yellow_min_stretches: 4
    traveltime_red_delay_percent: 150
    traveltime_red_min_stretches: 6
    avinor_delay_minutes: 15          # E-status regnes som forsinket først over dette
    avinor_yellow_cancelled: 10
    avinor_red_cancelled: 30
  betaling:
    # Statuspage-indikator → nivå
    indicator_levels: {none: 0, minor: 1, major: 2, critical: 2, maintenance: 0}

# Hvilke kilder som kjøres. false = hopp over.
sources:
  elvia: true
  statnett: true
  strompris: true
  nve: true
  met: true
  nodvarsel: true
  vegvesen: true
  ruter: true
  entur: true
  krisinformation: true
  vipps: true
  avinor: true
  polisen: true
  politiloggen: true            # ikke verifisert fra sandkassen; feiler mykt
  cloudflare_radar: false       # krever CLOUDFLARE_API_TOKEN i miljøet
  rss_news: true

# Entur-datasett som hentes fra SIRI SX (avvik). RUT = Ruter, BNR = Bane NOR,
# VYG = Vy, FLT = Flytoget. Maks 4 kall per minutt totalt.
entur_datasets: ["RUT", "BNR", "FLT"]

